services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: employee-mgmt-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Your_password123!"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"Your_password123!\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: employee-mgmt-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
      no_cache: true
    container_name: employee-mgmt-api
    depends_on:
      sqlserver:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: "Docker"
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=EmployeeManagementDb;User Id=sa;Password=Your_password123!;TrustServerCertificate=True;Encrypt=optional;MultipleActiveResultSets=true"
      Jwt__Key: "CHANGE_THIS_TO_A_LONG_RANDOM_SECRET_VALUE_AT_LEAST_32_CHARS"
      Jwt__Issuer: "EmployeeManagement.Api"
      Jwt__Audience: "EmployeeManagement.Client"
      RabbitMq__HostName: "rabbitmq"
      RabbitMq__Enabled: "true"
      Cors__AllowedOrigins__0: "http://localhost:3000"
      Cors__AllowedOrigins__1: "http://localhost:8080"
    ports:
      - "8080:8080"
    restart: on-failure
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/swagger/index.html"]
      interval: 10s
      timeout: 5s
      retries: 10

  client:
    build:
      context: ..
      dockerfile: docker/Dockerfile.client
      no_cache: true
    container_name: employee-mgmt-client
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "3000:80"
    restart: on-failure

volumes:
  sqlserver-data: